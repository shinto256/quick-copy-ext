name: quick-copy-ext
vision: >-
  フォーム入力で繰り返し使う定型文字列（英語住所など）を、ブラウザ拡張機能の登録リストから
  ワンクリックでコピーできるようにし、手打ち入力の手間なくWeb上の操作だけで完結させる。
goals:
  - 定型文字列の手入力にかかる時間・入力ミスを削減する
  - Chrome Web Store / Edgeアドオンストアで公開し、誰でもインストールして使える状態にする
  - プライバシーモードにより、画面共有中でも登録内容を第三者に見られずに使える
targetUsers:
  - 英語住所など定型文字列を繰り返しフォーム入力する一般ユーザー
  - 画面共有（オンライン商談・カスタマーサポート等）をしながら入力作業を行うユーザー

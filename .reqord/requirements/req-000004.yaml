versionHistory: []
files:
  description: requirements/req-000004/description.md
  supplementary: []
successCriteria:
  - グループは最大50個まで作成可能
  - グループ絞り込み操作から一覧の再描画までが300ms以内に完了する
  - グループ削除後、旧所属項目の100%が未分類として一覧に表示され、データ欠損は0件
  - グループ名は1〜30文字でバリデーションされ、範囲外入力は100%エラーとなる
format:
  type: ears
  ears:
    type: event-driven
    trigger: ユーザーがグループを作成し、登録項目にグループを割り当てたとき
    action: 項目をグループ単位で分類し、一覧をグループごとに表示・絞り込み可能にする
    response: グループ名の編集・削除、および項目のグループ変更が随時可能な状態を維持する

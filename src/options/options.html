<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Quick Copy - 設定</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <h1>Quick Copy - 項目・グループ管理</h1>

    <section aria-labelledby="form-heading">
      <h2 id="form-heading">項目の登録・編集</h2>
      <form id="item-form">
        <input type="hidden" id="item-id" value="" />
        <div class="field">
          <label for="item-name">名前（1〜50文字）</label>
          <input type="text" id="item-name" maxlength="50" required />
        </div>
        <div class="field">
          <label for="item-value">値（1〜2000文字、複数行可）</label>
          <textarea id="item-value" maxlength="2000" rows="5" required></textarea>
        </div>
        <div class="field">
          <label for="item-group">グループ</label>
          <select id="item-group">
            <option value="">未分類</option>
          </select>
        </div>
        <div class="actions">
          <button type="submit" id="item-save">保存</button>
          <button type="button" id="item-cancel" hidden>編集をキャンセル</button>
        </div>
        <p id="item-error" role="alert" class="error" hidden></p>
      </form>
    </section>

    <section aria-labelledby="list-heading">
      <h2 id="list-heading">登録済み項目</h2>
      <ul id="item-list"></ul>
    </section>

    <section aria-labelledby="group-heading">
      <h2 id="group-heading">グループ管理</h2>
      <form id="group-form">
        <div class="field">
          <label for="group-name">新規グループ名（1〜30文字）</label>
          <input type="text" id="group-name" maxlength="30" required />
        </div>
        <button type="submit">グループ作成</button>
        <p id="group-error" role="alert" class="error" hidden></p>
      </form>
      <ul id="group-list"></ul>
    </section>

    <script type="module" src="options.js"></script>
  </body>
</html>

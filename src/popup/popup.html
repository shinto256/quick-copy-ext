<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Quick Copy</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Quick Copy</h1>
      <label class="mask-toggle">
        <input type="checkbox" id="mask-toggle" />
        マスクを解除する
      </label>
    </header>

    <div class="field">
      <label for="group-filter">グループで絞り込み</label>
      <select id="group-filter">
        <option value="">すべて表示</option>
        <option value="__unassigned__">未分類</option>
      </select>
    </div>

    <ul id="item-list"></ul>
    <p id="empty-state" hidden>登録済みの項目はありません。options画面から登録してください。</p>
    <p id="copy-status" role="status"></p>

    <script type="module" src="popup.js"></script>
  </body>
</html>
